<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Défense Zombie 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  #hud { position: fixed; top: 12px; left: 12px; color: #fff; font-size: 18px; text-shadow: 0 0 4px #000; pointer-events: none; }
  #hud .barre { width: 220px; height: 12px; background: rgba(0,0,0,.5); border: 1px solid #fff; margin-bottom: 6px; }
  #hud .barre div { height: 100%; background: #d33; transition: width .2s; }
  #viseur { position: fixed; top: 50%; left: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; }
  #viseur::before, #viseur::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
  #viseur::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #viseur::after { top: 10px; left: 0; height: 2px; width: 22px; }
  #blessure { position: fixed; inset: 0; background: radial-gradient(transparent 40%, #c00); opacity: 0; transition: opacity .15s; pointer-events: none; }
  #ecran button { margin: 18px 8px 0; padding: 12px 28px; font-size: 20px; border: 0; border-radius: 6px; background: #c33; color: #fff; cursor: pointer; }
  #ecran button:hover { background: #e44; }
  #ecran { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #fff; background: rgba(0,0,0,.6); font-size: 22px; text-align: center; }
  #ecran h1 { margin: 0 0 12px; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="viseur"></div>
<div id="blessure"></div>
<div id="ecran"><h1 id="ecran-titre">Défense Zombie</h1><div id="ecran-texte"></div><div><button id="btn-jouer">Jouer</button><button id="btn-recommencer">Recommencer</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="src/scene.js?v=20261102143812"></script>
<script src="src/joueur.js?v=20261102143812"></script>
<script src="src/arme.js?v=20261102143812"></script>
<script src="src/zombies.js?v=20261102143812"></script>
<script src="src/hud.js?v=20261102143812"></script>
<script src="src/main.js?v=20261102143812"></script>
</body>
</html>
